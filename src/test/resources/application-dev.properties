# テスト用 application.properties (dev専用)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# NotificationHub, SendGrid, SMS Country など外部APIはテスト用ダミー値
notificationhub.api.url=http://localhost/dummy
notificationhub.api.key=dummy-key
sendgrid.api.key=dummy-key
smscountry.api.url=http://localhost/dummy
smscountry.api.user=dummy-user
smscountry.api.pass=dummy-pass

# リトライ・タイムアウト等もテスト用値
notification.retry.count=1
notification.timeout.millis=1000

# ログ出力先
logging.level.root=INFO
logging.level.com.toyota.tsc.notificationhub=DEBUG

# その他必要なテスト用プロパティは随時追加

# ===== Test (dev) properties =====
# SendGrid
sendgrid.api.key=dummy-test-key
sendgrid.from.address-T=noreply-toyota@example.com
sendgrid.from.name-T=TOYOTA
sendgrid.from.address-L=noreply-lexus@example.com
sendgrid.from.name-L=LEXUS

# Azure Notification Hubs
azure.notification-hub.retry-count=2

# その他、必要があれば追記
# ===== Test (dev) properties for Utility tests =====
# SendGrid
sendgrid.api.key=dummy-test-key
sendgrid.from.address-T=t-noreply@example.com
sendgrid.from.name-T=TOYOTA
sendgrid.from.address-L=l-noreply@example.com
sendgrid.from.name-L=LEXUS

# SmsCountry
sms-country.user=user@example.com
sms-country.pass=pass-123
sms-country.sender-id-t=TOYOTA-ID
sms-country.sender-id-l=LEXUS-ID
sms-country.api-url=https://api.smscountry.local/send

# Notification Hubs
azure.notification-hub.api-version=2020-01
azure.notification-hub.root-uri=https://%s.servicebus.windows.net/%s
azure.notification-hub.installation-uri=/installations/%s?api-version=%s
azure.notification-hub.sas.ttlSeconds=60
azure.notification-hub.http.timeoutMillis=1000
azure.notification-hub.namespace-t=ns-t
azure.notification-hub.hub-name-t=hub-t
azure.notification-hub.shared-access-key-name-t=keyname-t
azure.notification-hub.shared-access-key-t=key-t
azure.notification-hub.namespace-l=ns-l
azure.notification-hub.hub-name-l=hub-l
azure.notification-hub.shared-access-key-name-l=keyname-l
azure.notification-hub.shared-access-key-l=key-l
azure.notification-hub.sas.template=sr=%1$s&sig=%2$s&se=%3$d&skn=%4$s
azure.notification-hub.installation.payload.template={"id":"%s"}
azure.notification-hub.sdk.connection-string=Endpoint=sb://%s.servicebus.windows.net/;SharedAccessKeyName=%s;SharedAccessKey=%s
